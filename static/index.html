<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KazBank</title>
    <style>
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        :root {
            --brand: #3b3fd8;
            --brand-dark: #23258f;
            --bg: #f3f4fa;
            --text: #161a2b;
            --muted: #7a8099;
            --green: #12a150;
            --red: #e5484d;
        }
        body { margin: 0; background: linear-gradient(160deg, #dfe3f7, #eef0f8); font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); }
        .app { max-width: 420px; min-height: 100vh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(35, 37, 143, 0.12); }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; }
        .logo { font-size: 21px; font-weight: 800; letter-spacing: 0.3px; }
        .logo span { opacity: 0.7; font-weight: 500; }
        .screen { padding: 22px; flex: 1; }
        .muted { color: var(--muted); font-size: 14px; }
        h2 { margin: 6px 0 16px; font-size: 24px; }
        h3 { margin: 22px 0 10px; font-size: 17px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 4px; }
        select, input { width: 100%; padding: 14px; margin: 6px 0 14px; border: 1.5px solid #e1e4f0; border-radius: 14px; font-size: 16px; background: #fff; color: var(--text); outline: none; transition: border-color 0.15s; }
        select:focus, input:focus { border-color: var(--brand); }
        button { cursor: pointer; font-size: 16px; font-family: inherit; }
        .primary { width: 100%; padding: 15px; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; font-weight: 700; box-shadow: 0 6px 16px rgba(59, 63, 216, 0.3); transition: transform 0.1s; }
        .primary:active { transform: scale(0.98); }
        .primary:disabled { opacity: 0.6; cursor: default; }
        .link { background: rgba(255,255,255,0.15); border: 0; color: #fff; font-size: 14px; padding: 7px 14px; border-radius: 20px; }

        .hero { text-align: center; padding: 30px 10px 24px; }
        .hero .icon { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; font-size: 34px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(59, 63, 216, 0.35); }

        .hello { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .avatar { width: 46px; height: 46px; border-radius: 50%; background: #e3e4fb; color: var(--brand); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 17px; }
        .hello h2 { margin: 0; font-size: 21px; }

        .total { background: #fff; border-radius: 20px; padding: 18px 20px; margin-bottom: 6px; box-shadow: 0 2px 10px rgba(22, 26, 43, 0.06); }
        .big { font-size: 30px; font-weight: 800; margin-top: 4px; letter-spacing: -0.5px; }

        .bank-card { position: relative; overflow: hidden; border-radius: 20px; padding: 20px; margin-bottom: 14px; color: #fff; cursor: pointer; background: linear-gradient(135deg, #4f46e5, #7c3aed); box-shadow: 0 10px 22px rgba(79, 70, 229, 0.3); transition: transform 0.12s; }
        .bank-card:nth-child(2n) { background: linear-gradient(135deg, #0ea5a4, #2563eb); box-shadow: 0 10px 22px rgba(14, 165, 164, 0.3); }
        .bank-card:active { transform: scale(0.98); }
        .bank-card::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,0.12); }
        .bank-card .label { font-size: 13px; opacity: 0.8; }
        .bank-card .balance { font-size: 26px; font-weight: 800; margin: 6px 0 18px; }
        .bank-card .number { font-size: 15px; letter-spacing: 2px; opacity: 0.95; }

        .hint { font-size: 14px; font-weight: 600; margin: -8px 0 14px; min-height: 18px; }
        .message { margin-top: 16px; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; }
        .success { background: #e4f7ec; color: var(--green); }
        .error { background: #fdeaea; color: var(--red); }

        .card { background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(22, 26, 43, 0.05); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .op-left { display: flex; align-items: center; gap: 12px; }
        .op-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
        .op-icon.in { background: #e4f7ec; color: var(--green); }
        .op-icon.out { background: #fdeaea; color: var(--red); }
        .op-title { font-weight: 600; }
        .op-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .plus { color: var(--green); font-weight: 800; white-space: nowrap; }
        .minus { color: var(--red); font-weight: 800; white-space: nowrap; }

        .panel { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 2px 10px rgba(22, 26, 43, 0.06); }

        .screen { padding-bottom: 120px; }
        .nav {
            position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
            width: min(360px, calc(100% - 40px)); display: flex; padding: 6px; z-index: 10;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow:
                0 12px 32px rgba(35, 37, 143, 0.18),
                0 2px 6px rgba(0, 0, 0, 0.06),
                inset 0 1px 1px rgba(255, 255, 255, 0.9),
                inset 0 -1px 1px rgba(255, 255, 255, 0.25);
        }
        .nav-indicator {
            position: absolute; top: 6px; bottom: 6px; left: 6px;
            width: calc((100% - 12px) / 3); border-radius: 999px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 14px rgba(59, 63, 216, 0.18), inset 0 1px 1px rgba(255, 255, 255, 1);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav button {
            position: relative; z-index: 1; flex: 1; padding: 8px 0 7px; border: 0; background: none;
            color: #5b6178; font-size: 11px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            transition: color 0.25s;
        }
        .nav button svg { width: 23px; height: 23px; }
        .nav button.active { color: var(--brand); }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <span class="logo">Kaz<span>Bank</span></span>
        <button id="logout" class="link" onclick="logout()" hidden>Выйти</button>
    </header>

    <section id="login-screen" class="screen">
        <div class="hero">
            <div class="icon">₸</div>
            <h2>Добро пожаловать</h2>
            <p class="muted">Демо-режим: выберите клиента для входа</p>
        </div>
        <div class="panel">
            <label>Клиент</label>
            <select id="customer-select"></select>
            <button class="primary" onclick="login()">Войти</button>
        </div>
    </section>

    <section id="home-screen" class="screen" hidden>
        <div class="hello">
            <div id="avatar" class="avatar"></div>
            <div>
                <div class="muted">Добрый день</div>
                <h2 id="greeting"></h2>
            </div>
        </div>
        <div class="total">
            <span class="muted">Общий баланс</span>
            <div id="total" class="big"></div>
        </div>
        <h3>Мои счета</h3>
        <div id="accounts"></div>
        <p class="muted" style="text-align:center;">Нажмите на карту, чтобы открыть историю</p>
    </section>

    <section id="transfer-screen" class="screen" hidden>
        <h2>Перевод</h2>
        <div class="panel">
        <label>Со счёта</label>
        <select id="from-account"></select>

        <label>Номер счёта получателя</label>
        <input id="to-number" placeholder="Например, KZ0003" onchange="checkRecipient()">
        <div id="recipient" class="hint"></div>

        <label>Сумма, ₸</label>
        <input id="amount" type="number" min="1" placeholder="10000">

        <button id="transfer-btn" class="primary" onclick="makeTransfer()">Перевести</button>
        </div>
        <div id="transfer-message"></div>
    </section>

    <section id="history-screen" class="screen" hidden>
        <h2>История операций</h2>
        <div class="panel">
            <label>Счёт</label>
            <select id="history-account" onchange="loadHistory()"></select>
            <label>Пополнить счёт, ₸</label>
            <input id="topup-amount" type="number" min="1" placeholder="5000">
            <button class="primary" onclick="topUp()">Пополнить</button>
        </div>
        <div id="topup-message"></div>

        <h3>Операции</h3>
        <div id="history"></div>
    </section>

    <nav id="nav" class="nav" hidden>
        <span id="nav-indicator" class="nav-indicator"></span>
        <button data-screen="home-screen" onclick="openTab('home-screen')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>
            Счета
        </button>
        <button data-screen="transfer-screen" onclick="openTab('transfer-screen')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>
            Перевод
        </button>
        <button data-screen="history-screen" onclick="openTab('history-screen')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            История
        </button>
    </nav>
</div>

<script>
    let customers = [];
    let currentCustomer = null;
    let myAccounts = [];

    const ERRORS = {
        "insufficient funds": "Недостаточно средств",
        "account not found": "Счёт получателя не найден",
        "cannot transfer to the same account": "Нельзя перевести на тот же счёт",
        "amount must be a number > 0": "Введите сумму больше 0",
        "too many concurrent transfers, try again": "Банк занят, попробуйте ещё раз",
        "Database unavailable": "Сервис временно недоступен",
    };

    function money(x) {
        return Number(x).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + " ₸";
    }

    function show(screenId) {
        for (const screen of document.querySelectorAll(".screen")) {
            screen.hidden = screen.id !== screenId;
        }
        const buttons = [...document.querySelectorAll(".nav button")];
        buttons.forEach((button, i) => {
            const active = button.dataset.screen === screenId;
            button.classList.toggle("active", active);
            if (active) {
                document.getElementById("nav-indicator").style.transform = "translateX(" + (i * 100) + "%)";
            }
        });
    }

    function showMessage(elementId, text, isError) {
        const box = document.getElementById(elementId);
        box.className = "message " + (isError ? "error" : "success");
        box.textContent = text;
    }

    function clearMessage(elementId) {
        const box = document.getElementById(elementId);
        box.className = "";
        box.textContent = "";
    }

    function errorText(data) {
        const text = ERRORS[data.error] || data.error || "Неизвестная ошибка";
        return data.balance !== undefined ? text + ". Доступно: " + money(data.balance) : text;
    }

    async function api(url, options) {
        try {
            const response = await fetch(url, options);
            const data = await response.json();
            return { ok: response.ok, status: response.status, data: data };
        } catch (e) {
            return { ok: false, status: 0, data: { error: "Database unavailable" } };
        }
    }

    function postJson(url, body) {
        return api(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
        });
    }

    function fillAccountSelect(selectId, withBalance) {
        const select = document.getElementById(selectId);
        const previous = select.value;
        select.innerHTML = "";
        for (const a of myAccounts) {
            const option = document.createElement("option");
            option.value = a.account_id;
            option.textContent = withBalance ? a.account_number + " — " + money(a.balance) : a.account_number;
            select.appendChild(option);
        }
        if (previous) select.value = previous;
    }

    async function loadCustomerList() {
        const result = await api("/customers");
        customers = result.data;
        const select = document.getElementById("customer-select");
        select.innerHTML = "";
        for (const c of customers) {
            const option = document.createElement("option");
            option.value = c.id;
            option.textContent = c.name + " (" + c.city + ")";
            select.appendChild(option);
        }
    }

    async function login() {
        const id = Number(document.getElementById("customer-select").value);
        currentCustomer = customers.find(c => c.id === id);
        const parts = currentCustomer.name.split(" ");
        document.getElementById("greeting").textContent = parts[0];
        document.getElementById("avatar").textContent =
            parts.map(p => p[0]).join("").slice(0, 2).toUpperCase();
        document.getElementById("logout").hidden = false;
        document.getElementById("nav").hidden = false;
        await loadAccounts();
        openTab("home-screen");
    }

    async function loadAccounts() {
        const result = await api("/accounts?customer_id=" + currentCustomer.id);
        myAccounts = result.data;

        let total = 0;
        const box = document.getElementById("accounts");
        box.innerHTML = "";
        for (const a of myAccounts) {
            total += a.balance;

            const card = document.createElement("div");
            card.className = "bank-card";
            card.onclick = () => openHistory(a.account_id);

            const label = document.createElement("div");
            label.className = "label";
            label.textContent = "Баланс";

            const balance = document.createElement("div");
            balance.className = "balance";
            balance.textContent = money(a.balance);

            const number = document.createElement("div");
            number.className = "number";
            number.textContent = a.account_number;

            card.append(label, balance, number);
            box.appendChild(card);
        }
        document.getElementById("total").textContent = money(total);

        fillAccountSelect("from-account", true);
        fillAccountSelect("history-account", false);
    }

    function openTab(screenId) {
        show(screenId);
        if (screenId === "history-screen") loadHistory();
    }

    function openHistory(accountId) {
        document.getElementById("history-account").value = accountId;
        openTab("history-screen");
    }

    async function checkRecipient() {
        const number = document.getElementById("to-number").value.trim();
        const hint = document.getElementById("recipient");
        if (!number) {
            hint.textContent = "";
            return null;
        }
        const result = await api("/accounts/lookup?number=" + encodeURIComponent(number));
        if (result.ok) {
            hint.style.color = "#1d7a3a";
            hint.textContent = "Получатель: " + result.data.owner;
            return result.data;
        }
        hint.style.color = "#b42318";
        hint.textContent = "Счёт не найден";
        return null;
    }

    async function makeTransfer() {
        clearMessage("transfer-message");
        const button = document.getElementById("transfer-btn");
        const fromId = Number(document.getElementById("from-account").value);
        const amount = Number(document.getElementById("amount").value);

        const recipient = await checkRecipient();
        if (!recipient) {
            showMessage("transfer-message", "Счёт получателя не найден", true);
            return;
        }

        button.disabled = true;
        const result = await postJson("/transfer", {
            from_account: fromId,
            to_account: recipient.account_id,
            amount: amount,
        });
        button.disabled = false;

        if (result.ok) {
            showMessage("transfer-message",
                "Перевод выполнен ✅ " + money(amount) + " → " + recipient.owner, false);
            document.getElementById("amount").value = "";
            await loadAccounts();
        } else {
            showMessage("transfer-message", errorText(result.data), true);
        }
    }

    async function loadHistory() {
        const accountId = document.getElementById("history-account").value;
        const box = document.getElementById("history");
        box.innerHTML = "";
        if (!accountId) return;

        const result = await api("/transactions?account_id=" + accountId);
        const operations = result.data.slice().reverse();

        if (operations.length === 0) {
            const empty = document.createElement("p");
            empty.className = "muted";
            empty.textContent = "Операций пока нет";
            box.appendChild(empty);
            return;
        }

        for (const op of operations) {
            const card = document.createElement("div");
            card.className = "card";

            const isIn = op.tx_type === "credit";

            const left = document.createElement("div");
            left.className = "op-left";

            const icon = document.createElement("div");
            icon.className = "op-icon " + (isIn ? "in" : "out");
            icon.textContent = isIn ? "↓" : "↑";

            const text = document.createElement("div");
            const title = document.createElement("div");
            title.className = "op-title";
            title.textContent = isIn ? "Поступление" : "Списание";
            const date = document.createElement("div");
            date.className = "op-sub";
            date.textContent = new Date(op.created_at).toLocaleString("ru-RU");
            text.append(title, date);

            left.append(icon, text);

            const sum = document.createElement("span");
            sum.className = op.tx_type === "credit" ? "plus" : "minus";
            sum.textContent = (op.tx_type === "credit" ? "+" : "−") + money(op.amount);

            card.append(left, sum);
            box.appendChild(card);
        }
    }

    async function topUp() {
        clearMessage("topup-message");
        const accountId = Number(document.getElementById("history-account").value);
        const amount = Number(document.getElementById("topup-amount").value);

        const result = await postJson("/transactions", {
            account_id: accountId,
            amount: amount,
            tx_type: "credit",
        });

        if (result.ok) {
            showMessage("topup-message", "Счёт пополнен ✅ Баланс: " + money(result.data.new_balance), false);
            document.getElementById("topup-amount").value = "";
            await loadAccounts();
            await loadHistory();
        } else {
            showMessage("topup-message", errorText(result.data), true);
        }
    }

    function logout() {
        currentCustomer = null;
        myAccounts = [];
        document.getElementById("logout").hidden = true;
        document.getElementById("nav").hidden = true;
        clearMessage("transfer-message");
        clearMessage("topup-message");
        show("login-screen");
    }

    loadCustomerList();
</script>
</body>
</html>
